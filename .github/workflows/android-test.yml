name: Testar o app Android

# Gera os APKs, liga um emulador e usa o app de verdade
# (scripts/android-e2e.mjs). Roda sozinho quando muda algo que vai no APK (a
# interface também) e pelo botão Run workflow (Actions → Testar o app Android). As telas e o
# PDF salvo ficam nos Artifacts (teste-android).
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - "src/**"
      - "index.html"
      - "NOVIDADES.md"
      - "package.json"
      - "capacitor.config.json"
      - "scripts/android-e2e.mjs"
      - ".github/workflows/android-test.yml"

permissions:
  contents: read

jobs:
  emulador:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      # O "release" é assinado com uma chave descartável: confere a assinatura
      # do mesmo jeito que a do APK publicado.
      - name: Gerar os APKs
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon
          keytool -genkeypair -storetype PKCS12 -keystore "$RUNNER_TEMP/teste.p12" -alias pdfacrobat -keyalg RSA -keysize 2048 -validity 30 -storepass teste123 -keypass teste123 -dname "CN=Teste"
          ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/teste.p12" ANDROID_KEYSTORE_PASSWORD=teste123 ./gradlew assembleRelease --no-daemon
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$build_tools/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          "$build_tools/aapt2" dump badging app/build/outputs/apk/release/app-release.apk | head -5
          ls -la app/build/outputs/apk/*/
      - name: Preparar o Playwright
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install android
      - name: Ativar o KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Testar no emulador
        # Fixada no commit (de terceiros): v2.38.0.
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          PLAYWRIGHT: ${{ runner.temp }}/pw/node_modules/playwright/index.mjs
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: node scripts/android-e2e.mjs android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/debug/app-debug.apk android-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teste-android
          path: android-test/
