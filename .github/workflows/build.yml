name: Gerar instaladores

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]
    # Mudanças só de documentação não geram instaladores novos.
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    env:
      # Os instaladores não são assinados digitalmente.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Numa versão publicada (tag v1.2.3) o número do app vem da tag: é ele
      # que o programa instalado compara para saber se há atualização.
      - name: Usar o número da versão da tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+$ ]]; then version="$version.0"; fi
          npm version "$version" --no-git-tag-version --allow-same-version
      - run: npm run build
      # Tenta até 3 vezes: o download do Electron às vezes falha com erro
      # temporário do servidor (ex.: HTTP 500).
      - name: Gerar instalador
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npx electron-builder ${{ matrix.target }} --publish never && exit 0
            echo "Tentativa $attempt falhou; tentando de novo em 20 segundos..."
            sleep 20
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ runner.os }}
          # latest*.yml e .blockmap: informações que o programa instalado
          # consulta para se atualizar sozinho.
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
