name: Gerar instaladores

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    # Versões publicadas: tag com ou sem "v" (v1.2.0 ou 1.2.0).
    tags: ["v*", "[0-9]*"]
    # Mudanças só de documentação não geram instaladores novos.
    paths-ignore:
      - "**.md"
      - "docs/**"

# Só leitura; a publicação da versão (release) pede a escrita no próprio job.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    env:
      # Os instaladores não são assinados digitalmente.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Numa versão publicada (tag v1.2.3 ou 1.2.3) o número do app vem da tag: é ele
      # que o programa instalado compara para saber se há atualização.
      - name: Usar o número da versão da tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+$ ]]; then version="$version.0"; fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Tag inválida::A tag $GITHUB_REF_NAME não é um número de versão (use v1.2.3 ou 1.2.3)."
            exit 1
          fi
          npm version "$version" --no-git-tag-version --allow-same-version
      - run: npm run build
      # Tenta até 3 vezes: o download do Electron às vezes falha com erro
      # temporário do servidor (ex.: HTTP 500).
      - name: Gerar instalador
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npx electron-builder ${{ matrix.target }} --publish never && exit 0
            echo "Tentativa $attempt falhou; tentando de novo em 20 segundos..."
            sleep 20
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ runner.os }}
          # latest*.yml e .blockmap: informações que o programa instalado
          # consulta para se atualizar sozinho.
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    # Nas versões publicadas (tags), o job roda no ambiente "release": com os
    # secrets da chave guardados nele (ver o README), só as tags chegam a eles.
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: Usar o número da versão da tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+$ ]]; then version="$version.0"; fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Tag inválida::A tag $GITHUB_REF_NAME não é um número de versão (use v1.2.3 ou 1.2.3)."
            exit 1
          fi
          npm version "$version" --no-git-tag-version --allow-same-version
      - run: npm run build
      - run: npx cap sync android
      # O APK publicado é assinado sempre com a mesma chave (secrets, ver o
      # README): sem isso o Android não aceita a versão nova por cima da antiga.
      # A chave só entra nas versões publicadas (tags); nos outros envios, e sem
      # os secrets, sai só um APK de teste.
      - name: Gerar o APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ startsWith(github.ref, 'refs/tags/') && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p release
          cd android
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            # Colado no site do GitHub, o secret pode ficar com quebra de linha (no
            # Windows, \r\n) ou espaços, que não fazem parte da chave nem da senha.
            keystore="$RUNNER_TEMP/pdfacrobat.p12"
            key=$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]')
            if ! printf '%s' "$key" | base64 -d > "$keystore"; then
              # Descreve o que foi colado, sem mostrar a chave.
              extra=$(printf '%s' "$key" | tr -d 'A-Za-z0-9+/=')
              echo "O secret tem $(printf '%s\n' "$ANDROID_KEYSTORE_BASE64" | grep -c .) linha(s) com texto e ${#key} caracteres sem contar os espaços; ${#extra} deles não são de base64."
              echo "::error title=Chave do Android inválida::O secret ANDROID_KEYSTORE_BASE64 não é o texto da chave. Cadastre de novo colando só a chave em base64 (uma linha longa), sem o nome do secret nem outras linhas."
              exit 1
            fi
            # O $(...) já tira as quebras de linha do fim; falta o \r do Windows.
            ANDROID_KEYSTORE_PASSWORD=$(printf '%s' "$ANDROID_KEYSTORE_PASSWORD" | tr -d '\r')
            export ANDROID_KEYSTORE_PASSWORD ANDROID_KEYSTORE_FILE="$keystore"
            if ! keytool -list -v -keystore "$keystore" -storetype PKCS12 -storepass:env ANDROID_KEYSTORE_PASSWORD > "$RUNNER_TEMP/chave.txt" 2>&1; then
              if grep -q 'password was incorrect' "$RUNNER_TEMP/chave.txt"; then
                echo "O secret da senha tem $(printf '%s\n' "$ANDROID_KEYSTORE_PASSWORD" | grep -c .) linha(s) com texto."
                echo "::error title=Senha da chave do Android errada::O secret ANDROID_KEYSTORE_PASSWORD não abre a chave. Cadastre de novo colando só a senha."
              else
                echo "::error title=Chave do Android inválida::O secret ANDROID_KEYSTORE_BASE64 não tem a chave inteira. Cadastre de novo colando a chave em base64 inteira."
              fi
              exit 1
            fi
            # Impressão digital do certificado (é pública): mostra qual chave assina o APK.
            grep -m1 'SHA256:' "$RUNNER_TEMP/chave.txt" || true
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "../release/PDF-Acrobat-$version-android.apk"
          else
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::warning title=APK sem a chave de assinatura::Cadastre os secrets ANDROID_KEYSTORE_BASE64 e ANDROID_KEYSTORE_PASSWORD (veja o README) para o APK entrar nas versões publicadas."
            fi
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "../release/PDF-Acrobat-$version-android-teste.apk"
          fi
      - uses: actions/upload-artifact@v4
        if: hashFiles('release/*-android.apk') != ''
        with:
          name: instalador-Android
          path: release/*-android.apk
      - uses: actions/upload-artifact@v4
        if: hashFiles('release/*-android-teste.apk') != ''
        with:
          name: apk-de-teste
          path: release/*-android-teste.apk

  release:
    # O APK não segura a publicação dos instaladores de computador.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') && needs.build.result == 'success' }}
    needs: [build, android]
    runs-on: ubuntu-latest
    # Criar a versão e anexar os instaladores.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: instalador-*
          merge-multiple: true
      # Fixada no commit (de terceiros, recebe permissão de escrita): v2.6.2.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: artifacts/*
          generate_release_notes: true
