name: Publicar versão web

# A versão web (navegador e celular) é publicada no GitHub Pages a cada envio
# de código para o branch principal, ou manualmente pelo botão "Run workflow".
# O ambiente "github-pages" só aceita publicar a partir do branch principal
# (tags de versão são recusadas), por isso não usamos o evento de Releases.
# Antes da primeira vez: Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: ["**"]
    # As novidades aparecem no app; o resto da documentação não.
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "NOVIDADES.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A versão web sai do branch principal, já com tudo que entrou nele: o
      # número dela é o da versão mais nova do NOVIDADES.md.
      - name: Número da versão
        run: |
          if version=$(node scripts/novidades.mjs ultima); then
            npm version "$version" --no-git-tag-version --allow-same-version
          else
            echo "::warning title=Sem novidades::O NOVIDADES.md não tem nenhuma versão; a versão web fica com o número do package.json."
          fi
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
